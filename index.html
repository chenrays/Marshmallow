<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>炭火烤棉花糖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=DM+Mono:wght@500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* 單一夜晚營火場景：全螢幕畫布，HUD 浮在上方，結算卡片置中 */
:root{
  --night:#120f16; --ink:#1c1720; --ash:#8f8494; --cream:#f4ead8;
  --ember:#ff7a2f; --glow:#ffc46b; --char:#3a2a22;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--cream);font-family:var(--f-body);touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.timer{font-family:var(--f-num);font-size:2rem;letter-spacing:.02em;color:var(--glow);text-shadow:0 0 18px rgba(255,122,47,.45);font-variant-numeric:tabular-nums}
.lbl{font-size:.7rem;letter-spacing:.12em;color:var(--ash)}
.meters{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bar{width:120px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--ember))}
.heat{font-family:var(--f-display);font-size:1rem;color:var(--cream)}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.map{pointer-events:none}
.map canvas{display:block;width:160px;height:42px;border-radius:4px;border:1px solid rgba(255,255,255,.12);margin-top:4px;image-rendering:pixelated}
.btns{display:flex;gap:10px;pointer-events:auto}
button{font-family:var(--f-display);font-size:1.1rem;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;color:var(--night);background:var(--glow);box-shadow:0 4px 20px rgba(255,150,60,.3)}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
button.ghost{background:transparent;color:var(--cream);border:1px solid rgba(244,234,216,.4);box-shadow:none}
#blow{background:#7fd1ff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,12,.62);backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;overflow:auto;touch-action:auto}
.card{width:min(440px,100%);background:var(--ink);border:1px solid rgba(255,196,107,.18);border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-family:var(--f-display);font-size:2.2rem;margin:0;color:var(--glow);text-wrap:balance;line-height:1.15}
h2{font-family:var(--f-display);margin:0;font-size:1.3rem}
p{margin:0;line-height:1.7;color:#d9cfc0}
ul{margin:0;padding-left:1.1em;line-height:1.8;color:#d9cfc0}
.score{font-family:var(--f-num);font-size:3.6rem;color:var(--glow);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,122,47,.5)}
.score small{font-size:1rem;color:var(--ash)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:5.5em 1fr 4.5em;align-items:center;gap:10px;font-size:.9rem}
.row .bar{width:100%}
.row b{font-family:var(--f-num);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.row.pen b{color:#ff8b7a}
#resMap{width:100%;height:64px;border-radius:6px;image-rendering:pixelated;border:1px solid rgba(255,255,255,.1)}
.tip{font-size:.85rem;color:var(--ash)}
@media (prefers-reduced-motion:reduce){#blow{animation:none}}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="hud" id="hud" hidden>
  <div>
    <div class="lbl">烘烤時間</div>
    <div class="timer" id="timer">00:00.0</div>
  </div>
  <div class="meters">
    <div class="lbl">內芯軟化</div>
    <div class="bar"><i id="coreBar"></i></div>
  </div>
</div>

<div class="bottom" id="bottom" hidden>
  <div></div>
  <div class="btns">
    <button id="blow" hidden>吹熄！</button>
    <button id="eat">拿起品嚐</button>
  </div>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <h1>炭火烤棉花糖</h1>
    <p>把棉花糖烤到外層均勻金黃、內芯微微融化，就能拿到 1000 分的「完美精華」。</p>
    <ul>
      <li><b>左右滑</b>：轉動竹籤，讓每一面都烤到</li>
      <li><b>上下滑</b>：調整離炭火的高度，越低越旺</li>
      <li>太焦會<b>起火</b>，趕快按「吹熄」</li>
      <li>內芯要慢慢熱，太急或烤太久都會扣分</li>
      <li>覺得剛好就按「拿起品嚐」結算</li>
    </ul>
    <p class="tip" id="best"></p>
    <button id="start">開始烤</button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="card">
    <h2 id="rTitle">完美精華</h2>
    <div class="score"><span id="rScore">0</span> <small>/ 1000</small></div>
    <div class="rows" id="rRows"></div>
    <p class="tip" id="rTip"></p>
    <button id="again">再烤一顆</button>
  </div>
</div>

<script>
const N=40, M=7;
const cv=document.getElementById('stage'), cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

let S;
function reset(){S={d:new Float32Array(N*M),core:0,rot:0,rotV:0,h:.7,t:0,burning:false,burnT:0,burnTotal:0,phase:'play',sag:0};}
reset();S.phase='intro';

// ---- color ramp for doneness ----
const RAMP=[[0,[248,244,236]],[.35,[245,228,190]],[.6,[230,176,92]],[.75,[212,140,58]],[.95,[160,92,40]],[1.15,[80,46,26]],[1.4,[30,22,18]]];
function col(d){
  if(d<=0)return RAMP[0][1].slice();
  for(let k=1;k<RAMP.length;k++){if(d<=RAMP[k][0]){const [a,ca]=RAMP[k-1],[b,cb]=RAMP[k],u=(d-a)/(b-a);return ca.map((v,i)=>v+(cb[i]-v)*u);}}
  return RAMP[RAMP.length-1][1].slice();
}
const rgb=(c,m=1,add=[0,0,0])=>`rgb(${Math.min(255,c[0]*m+add[0])|0},${Math.min(255,c[1]*m+add[1])|0},${Math.min(255,c[2]*m+add[2])|0})`;

// ---- physics ----
const rate=h=>0.01+0.22*Math.pow(1-h,2);
function hot(j,t){return 1+0.13*Math.sin(t*0.7+j*2.1)+0.07*Math.sin(t*5.3)*Math.sin(t*2.3+j);}
function update(dt){
  if(!dragging){
    if(keys.ArrowLeft)S.rotV=-3.2; else if(keys.ArrowRight)S.rotV=3.2; else S.rotV*=Math.exp(-2.5*dt);
    if(keys.ArrowUp)S.h=Math.min(1,S.h+0.6*dt); if(keys.ArrowDown)S.h=Math.max(0,S.h-0.6*dt);
  }
  S.rot+=S.rotV*dt;
  S.t+=dt;
  const r=rate(S.h);
  for(let i=0;i<N;i++){
    const phi=i*2*Math.PI/N+S.rot, c=Math.cos(phi), f=Math.max(0,c);
    for(let j=0;j<M;j++){
      const k=i*M+j, local=r*f*hot(j,S.t);
      S.d[k]+=(local+0.0015)*dt;
      if(S.burning) S.d[k]+=(c<0?0.3:0.16)*dt;
      else if(S.d[k]>0.95&&local>0.06&&Math.random()<dt*3*(local-0.06)*10) ignite();
    }
  }
  S.core+=0.016*Math.min(r/0.035,1)*dt+(S.burning?0.01*dt:0);
  if(S.burning){S.burnT+=dt;S.burnTotal+=dt;if(S.burnT>7)extinguish();}
  S.sag+=((S.core>1.3?Math.min(1,(S.core-1.3)/0.5):0)-S.sag)*dt*2;
}
function ignite(){if(S.burning)return;S.burning=true;S.burnT=0;blowBtn.hidden=false;}
function extinguish(){S.burning=false;blowBtn.hidden=true;for(let q=0;q<14;q++)smoke.push({x:mm.x+(Math.random()-.5)*mm.L,y:mm.y,v:20+Math.random()*30,a:1,s:8+Math.random()*10});}

// ---- particles ----
const sparks=[],flames=[],smoke=[];
let mm={x:0,y:0,L:0,R:0};
function coalY(){return H*0.8;}
function drawScene(dt,time){
  // sky
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0a12');g.addColorStop(.6,'#1a1218');g.addColorStop(1,'#2b1610');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // stars
  cx.fillStyle='rgba(244,234,216,.5)';
  for(let s=0;s<40;s++){const x=(s*137.5)%W,y=((s*71.3)%(H*0.45));const tw=.4+.6*Math.abs(Math.sin(time*0.6+s));cx.globalAlpha=tw*0.6;cx.fillRect(x,y,1.3,1.3);}
  cx.globalAlpha=1;
  const cyv=coalY(), r=rate(S.h), inten=0.5+r*3;
  // glow
  const gl=cx.createRadialGradient(W/2,cyv,10,W/2,cyv,Math.max(W,H)*0.6);
  gl.addColorStop(0,`rgba(255,110,40,${0.35*inten})`);gl.addColorStop(1,'rgba(255,110,40,0)');
  cx.fillStyle=gl;cx.fillRect(0,0,W,H);
  // stones ring
  const bw=Math.min(W*0.85,520);
  cx.fillStyle='#2a2326';
  for(let s=0;s<9;s++){const x=W/2-bw/2+s*bw/8;cx.beginPath();cx.ellipse(x,cyv+28+Math.sin(s)*4,bw/14,16,0,0,7);cx.fill();}
  // coals
  for(let s=0;s<26;s++){
    const x=W/2-bw*0.42+((s*53)%26)/26*bw*0.84, y=cyv+((s*29)%7)*3-6, rr=12+(s%4)*4;
    const p=.55+.45*Math.sin(time*(1.2+(s%5)*.3)+s);
    const cg=cx.createRadialGradient(x,y,1,x,y,rr);
    cg.addColorStop(0,`rgba(255,${150+80*p|0},80,${.9*p})`);cg.addColorStop(.6,`rgba(200,50,20,${.8})`);cg.addColorStop(1,'#1d1010');
    cx.fillStyle=cg;cx.beginPath();cx.ellipse(x,y,rr*1.3,rr*.75,0,0,7);cx.fill();
  }
  // low flames
  if(Math.random()<dt*40*inten)flames.push({x:W/2+(Math.random()-.5)*bw*0.75,y:cyv-4,v:40+Math.random()*60*inten,a:1,s:6+Math.random()*10});
  if(Math.random()<dt*8*inten)sparks.push({x:W/2+(Math.random()-.5)*bw*0.6,y:cyv-8,vx:(Math.random()-.5)*30,vy:-60-Math.random()*90,a:1});
  cx.globalCompositeOperation='lighter';
  for(let q=flames.length-1;q>=0;q--){const f=flames[q];f.y-=f.v*dt;f.a-=dt*1.8;f.s*=1-dt*.8;if(f.a<=0){flames.splice(q,1);continue;}
    cx.fillStyle=`rgba(255,${120+100*f.a|0},40,${f.a*.5})`;cx.beginPath();cx.arc(f.x+Math.sin(time*8+f.y*.05)*3,f.y,f.s,0,7);cx.fill();}
  for(let q=sparks.length-1;q>=0;q--){const p=sparks[q];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx+=Math.sin(time*3+q)*20*dt;p.a-=dt*.6;if(p.a<=0){sparks.splice(q,1);continue;}
    cx.fillStyle=`rgba(255,200,110,${p.a})`;cx.fillRect(p.x,p.y,2,2);}
  cx.globalCompositeOperation='source-over';
}

function drawMarsh(time){
  const L=Math.min(W*0.38,210), R=L*0.4;
  const yHi=H*0.24, yLo=coalY()-R-30;
  const y=yHi+(yLo-yHi)*(1-S.h), x=W*0.56;
  mm={x,y,L,R};
  // stick
  cx.strokeStyle='#8a6a48';cx.lineWidth=6;cx.lineCap='round';
  cx.beginPath();cx.moveTo(-10,y-60);cx.lineTo(x+L/2+26,y+4);cx.stroke();
  cx.strokeStyle='#5a4230';cx.lineWidth=2;cx.beginPath();cx.moveTo(-10,y-57);cx.lineTo(x+L/2+26,y+6);cx.stroke();
  const sag=S.sag, Ry=R*(1-0.12*sag), x0=x-L/2;
  cx.save();
  // 枕頭狀曲面輪廓：兩端圓弧、上下微鼓
  const bul=Ry*0.06, ex=R*0.42, yb0=y+Ry+sag*10;
  cx.beginPath();
  cx.moveTo(x0+ex,y-Ry);
  cx.quadraticCurveTo(x+0,y-Ry-bul,x0+L-ex,y-Ry);
  cx.bezierCurveTo(x0+L+ex*0.35,y-Ry,x0+L+ex*0.35,yb0,x0+L-ex,yb0);
  cx.quadraticCurveTo(x,yb0+bul,x0+ex,yb0);
  cx.bezierCurveTo(x0-ex*0.35,yb0,x0-ex*0.35,y-Ry,x0+ex,y-Ry);
  cx.closePath();
  cx.save();cx.shadowColor='rgba(0,0,0,.35)';cx.shadowBlur=18;cx.shadowOffsetY=8;cx.fillStyle='#000';cx.fill();cx.restore();
  cx.clip();
  // strips, back→front
  const strips=[];
  for(let i=0;i<N;i++){
    const th=i*2*Math.PI/N+S.rot, half=Math.PI/N;
    const z=Math.sin(th);
    if(z<-0.25)continue;
    strips.push({i,th,z,ya:y+Ry*Math.cos(th-half),yb:y+Ry*Math.cos(th+half)});
  }
  strips.sort((a,b)=>a.z-b.z);
  const r=rate(S.h);
  for(const s of strips){
    const down=Math.max(0,Math.cos(s.th));
    const light=0.62+0.38*Math.max(0,s.z);
    const warm=[90*down*r*4,30*down*r*4,0];
    const gr=cx.createLinearGradient(x0,0,x0+L,0);
    for(let j=0;j<M;j++)gr.addColorStop((j+.5)/M,rgb(col(S.d[s.i*M+j]),light,warm));
    cx.fillStyle=gr;
    const top=Math.min(s.ya,s.yb), bot=Math.max(s.ya,s.yb);
    cx.fillRect(x0-ex,top-1,L+ex*2,bot-top+2+(bot>y+Ry*0.9?sag*10:0));
  }
  // 圓柱明暗：上緣受光、下緣被火映紅、上下邊緣收暗
  const sh=cx.createLinearGradient(0,y-Ry,0,yb0);
  sh.addColorStop(0,'rgba(20,10,10,.35)');sh.addColorStop(.12,'rgba(255,255,255,.05)');
  sh.addColorStop(.3,'rgba(255,255,255,.22)');sh.addColorStop(.42,'rgba(255,255,255,0)');
  sh.addColorStop(.85,`rgba(255,110,40,${0.08+r*0.8})`);sh.addColorStop(1,'rgba(20,8,6,.4)');
  cx.fillStyle=sh;cx.fillRect(x0-ex,y-Ry-bul,L+ex*2,Ry*2+bul*2+12);
  // 兩端圓角收暗，做出端面的曲度
  const se=cx.createLinearGradient(x0-ex*0.35,0,x0+L+ex*0.35,0);
  se.addColorStop(0,'rgba(15,8,8,.45)');se.addColorStop(.1,'rgba(0,0,0,0)');
  se.addColorStop(.9,'rgba(0,0,0,0)');se.addColorStop(1,'rgba(15,8,8,.45)');
  cx.fillStyle=se;cx.fillRect(x0-ex,y-Ry-bul,L+ex*2,Ry*2+bul*2+12);
  // 粉粉的表面顆粒
  cx.fillStyle='rgba(255,255,255,.06)';
  for(let q=0;q<60;q++){const px=x0+((q*61)%60)/60*L, py=y-Ry+((q*37)%60)/60*Ry*2;cx.fillRect(px,py,1.5,1.5);}
  cx.restore();
  // drip
  if(sag>0.2){cx.fillStyle=rgb(col(0.3));cx.beginPath();cx.ellipse(x+L*0.15,y+Ry+sag*16,5,6+sag*8,0,0,7);cx.fill();}
  // burning flames on marshmallow
  if(S.burning){
    cx.globalCompositeOperation='lighter';
    for(let q=0;q<22;q++){
      const fx=x0+((q*37)%22)/22*L, ph=time*9+q;
      const fh=R*(0.7+0.5*Math.abs(Math.sin(ph)));
      const fg=cx.createRadialGradient(fx,y-Ry,1,fx,y-Ry-fh*.4,fh);
      fg.addColorStop(0,'rgba(255,240,170,.7)');fg.addColorStop(.4,'rgba(255,130,30,.45)');fg.addColorStop(1,'rgba(255,60,0,0)');
      cx.fillStyle=fg;cx.beginPath();cx.ellipse(fx,y-Ry-fh*.35,fh*.35,fh*.75,0,0,7);cx.fill();
    }
    cx.globalCompositeOperation='source-over';
  }
  for(let q=smoke.length-1;q>=0;q--){const p=smoke[q];p.y-=p.v*0.016;p.s+=0.4;p.a-=0.012;if(p.a<=0){smoke.splice(q,1);continue;}
    cx.fillStyle=`rgba(160,150,160,${p.a*.35})`;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();}
}

function drawMap(ctx,w,h,showDown){
  ctx.clearRect(0,0,w,h);
  const cw=w/N, ch=h/M;
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){ctx.fillStyle=rgb(col(S.d[i*M+j]));ctx.fillRect(i*cw,j*ch,cw+.5,ch+.5);}
  if(showDown){
    let best=0,bi=0;for(let i=0;i<N;i++){const c=Math.cos(i*2*Math.PI/N+S.rot);if(c>best){best=c;bi=i;}}
    ctx.strokeStyle='#ff7a2f';ctx.lineWidth=2;ctx.strokeRect(bi*cw+1,1,cw-2,h-2);
  }
}

// ---- scoring ----
function cellScore(d){
  if(d>=0.6&&d<=0.8)return 1;
  if(d<0.6)return Math.pow(Math.max(0,(d-0.15)/0.45),1.5);
  return Math.pow(Math.max(0,1-(d-0.8)/0.35),1.2);
}
function score(){
  const d=S.d;let sum=0,mean=0;for(const v of d){sum+=cellScore(v);mean+=v;}mean/=d.length;
  const surface=400*sum/d.length;
  let varr=0;for(const v of d)varr+=(v-mean)**2;const sd=Math.sqrt(varr/d.length);
  let cov=0;for(let i=0;i<N;i++){let a=0;for(let j=0;j<M;j++)a+=d[i*M+j];if(a/M>=0.5)cov++;}
  const uniform=250*(cov/N)*Math.max(0,1-Math.max(0,sd-0.05)/0.25);
  const c=S.core;const core=c<0.85?150*(c/0.85)**2:c<=1.15?150:150*Math.max(0,1-(c-1.15)/0.5);
  const t=S.t;const time=t<40?200*(t/40)**2:t<=90?200:200*Math.max(0,1-(t-90)/90);
  let charred=0;for(const v of d)if(v>1.2)charred++;
  const pen=charred*15*48/(N*M)+S.burnTotal*20;
  const total=Math.max(0,Math.min(1000,Math.round(surface+uniform+core+time-pen)));
  return {surface,uniform,core,time,pen,total,mean,cov,sd,charred};
}

// ---- UI ----
const $=id=>document.getElementById(id);
const blowBtn=$('blow');
let best=0;try{best=+localStorage.getItem('mm-best')||0;}catch(e){}
function showBest(){$('best').textContent=best?`目前最佳：${best} 分`:'';}
showBest();
function start(){reset();$('intro').hidden=true;$('result').hidden=true;$('hud').hidden=false;$('bottom').hidden=false;blowBtn.hidden=true;}
$('start').onclick=start;$('again').onclick=start;
blowBtn.onclick=e=>{e.stopPropagation();extinguish();};
$('eat').onclick=()=>finish();
function finish(){
  if(S.phase!=='play')return;S.phase='result';if(S.burning)extinguish();
  const r=score();
  $('hud').hidden=true;$('bottom').hidden=true;$('result').hidden=false;
  let title;
  if(r.total>=1000)title='完美精華 ✦';else if(r.total>=900)title='金黃大師';else if(r.total>=750)title='外酥內軟';
  else if(r.total>=550)title='還不錯吃';else if(r.total>=350)title='有點可惜';else title=r.mean>1?'焦炭紀念品':'還是生的';
  $('rTitle').textContent=title;
  const rows=[['表面熟度',r.surface,400],['每面均勻',r.uniform,250],['內芯軟化',r.core,150],['烘烤時間',r.time,200]];
  $('rRows').innerHTML=rows.map(([n,v,m])=>`<div class="row"><span>${n}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b>${Math.round(v)}/${m}</b></div>`).join('')
    +(r.pen>0?`<div class="row pen"><span>焦黑/起火</span><div></div><b>−${Math.round(r.pen)}</b></div>`:'');
  const tips=[];
  if(r.cov<N)tips.push(`有一側約 ${Math.round((N-r.cov)/N*360)}° 幾乎沒烤到，記得持續轉動。`);
  if(r.sd>0.15)tips.push('顏色深淺不一，轉速再平均一點。');
  if(r.charred)tips.push(`約 ${Math.round(r.charred/(N*M)*100)}% 的表面烤焦了，火太近或停太久。`);
  if(S.core<0.85)tips.push('內芯還沒軟，離火遠一點、慢慢烤。');
  if(S.core>1.3)tips.push('烤太久，內芯已經融到快掉下來。');
  if(S.t<40)tips.push('太急了，理想時間是 40～90 秒。');
  if(!tips.length)tips.push('外層金黃、內芯綿軟，這就是營火的味道。');
  $('rTip').textContent=tips.join(' ');
  let animN=0;const target=r.total;const step=()=>{animN+=Math.max(1,(target-animN)*.12);if(animN>=target)animN=target;$('rScore').textContent=Math.round(animN);if(animN<target)requestAnimationFrame(step);};step();
  if(r.total>best){best=r.total;try{localStorage.setItem('mm-best',best);}catch(e){}}
  showBest();
}

// ---- input ----
let dragging=false,lx=0,ly=0,lt=0;const keys={};
cv.addEventListener('pointerdown',e=>{if(S.phase!=='play')return;dragging=true;lx=e.clientX;ly=e.clientY;lt=performance.now();S.rotV=0;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;const now=performance.now(),dx=e.clientX-lx,dy=e.clientY-ly,dtm=Math.max(1,now-lt)/1000;
  const dr=dx*0.014;S.rot+=dr;S.rotV=S.rotV*0.6+(dr/dtm)*0.4;
  S.h=Math.max(0,Math.min(1,S.h-dy/(H*0.5)));
  lx=e.clientX;ly=e.clientY;lt=now;
});
const end=()=>{dragging=false;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '&&S.burning){extinguish();e.preventDefault();}if(e.key==='Enter'&&S.phase==='play')finish();});
addEventListener('keyup',e=>{keys[e.key]=false;});

// ---- loop ----
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(S.phase==='play')update(dt);
  drawScene(dt,now/1000);drawMarsh(now/1000);
  if(S.phase==='play'){
    const t=S.t;$('timer').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')}`;
    $('coreBar').style.width=Math.min(100,S.core/1.15*100)+'%';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
